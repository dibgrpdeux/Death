<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صدى الخرسانة: الاستدعاء - دليل طالب ENSTP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #030303;
      --panel-bg: rgba(10, 12, 16, 0.95);
      --red-glow: #ff2a3a;
      --red-dim: #7a121c;
      --accent-gold: #d4af37;
      --text-light: #e0e6ed;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 42, 58, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Cairo', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Fog Canvas Background */
    #fog-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Screen Overlay Vignette & Glitch */
    .screen-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 5;
      pointer-events: none;
      background: 
        radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.95) 100%),
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 100%, 100% 4px;
    }

    /* Entry Intro Modal */
    .intro-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #050505;
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .intro-box {
      background: rgba(20, 5, 8, 0.9);
      border: 2px solid var(--red-glow);
      padding: 40px;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 0 50px rgba(255, 42, 58, 0.5);
    }

    .intro-box h1 {
      font-family: 'Amiri', serif;
      color: var(--red-glow);
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .intro-box input {
      width: 100%;
      background: #111;
      border: 1px solid var(--red-glow);
      color: var(--accent-gold);
      padding: 12px;
      margin: 20px 0;
      border-radius: 6px;
      font-size: 1.1rem;
      text-align: center;
      font-family: 'Cairo', sans-serif;
    }

    .btn-danger {
      background: var(--red-dim);
      color: white;
      border: 1px solid var(--red-glow);
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s;
    }

    .btn-danger:hover {
      background: var(--red-glow);
      box-shadow: 0 0 20px var(--red-glow);
      transform: scale(1.05);
    }

    /* Main Perspective View (3D/POV Simulation) */
    .pov-container {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Background Haunted Courtyard */
    .courtyard-bg {
      position: absolute;
      width: 110%; height: 110%;
      background: url('https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      filter: grayscale(80%) contrast(150%) brightness(35%) sepia(50%) hue-rotate(300deg);
      transition: transform 0.1s ease-out;
    }

    /* Big Wanted Billboard with Student Info */
    .billboard {
      position: absolute;
      top: 15%;
      background: rgba(0, 0, 0, 0.85);
      border: 3px double var(--red-glow);
      padding: 20px 40px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 42, 58, 0.6);
      transform: perspective(500px) rotateX(10deg);
      animation: flicker 3s infinite alternate;
    }

    .billboard h3 {
      color: var(--accent-gold);
      font-size: 1.2rem;
    }

    .billboard h2 {
      color: var(--red-glow);
      font-size: 2.2rem;
      font-family: 'Amiri', serif;
    }

    /* Advancing Entity/Shadow Figure */
    .advancing-entity {
      position: absolute;
      bottom: 5%;
      width: 320px;
      height: 480px;
      background: url('https://images.unsplash.com/photo-1500462825327-021b38e072a2?auto=format&fit=crop&w=800&q=80') center/contain no-repeat;
      filter: drop-shadow(0 0 25px #ff2a3a) grayscale(100%) contrast(200%);
      transform-origin: bottom center;
      transform: scale(0.3);
      opacity: 0.8;
      transition: transform 0.2s linear, filter 0.2s;
    }

    /* HUD Dashboard Overlay */
    .hud-header {
      position: fixed;
      top: 15px; left: 20px; right: 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 12px 25px;
      border-radius: 8px;
    }

    .radar-box {
      color: var(--red-glow);
      font-weight: bold;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Map Zones Floating Grid at Bottom */
    .hud-zones {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      max-width: 95vw;
      padding: 10px;
    }

    .hud-btn {
      background: rgba(15, 18, 22, 0.9);
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: 'Cairo', sans-serif;
    }

    .hud-btn:hover {
      background: var(--red-dim);
      border-color: var(--red-glow);
      transform: translateY(-3px);
    }

    /* Modal Display */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0f1216;
      border: 2px solid var(--red-glow);
      width: 100%;
      max-width: 700px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 30px;
      position: relative;
      box-shadow: 0 0 50px rgba(255, 42, 58, 0.6);
    }

    .close-modal {
      position: absolute;
      top: 15px; left: 20px;
      background: none; border: none;
      color: var(--text-muted); font-size: 2rem;
      cursor: pointer;
    }

    .close-modal:hover { color: var(--red-glow); }

    .quiz-option {
      display: block; width: 100%; text-align: right;
      background: #181d24; border: 1px solid rgba(255,255,255,0.1);
      color: white; padding: 12px 15px; margin: 10px 0;
      border-radius: 4px; cursor: pointer;
    }

    .quiz-option:hover { background: var(--red-dim); }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <!-- Entry Name Prompt -->
  <div class="intro-screen" id="intro-screen">
    <div class="intro-box">
      <h1>صدى الخرسانة</h1>
      <p>أدخل بياناتك لدخول الساحة وحل ألغاز دليل ENSTP</p>
      <input type="text" id="input-student-name" placeholder="أدخل اسمك الكامل..." value="طالب جديد">
      <button class="btn-danger" onclick="startExperience()">تأكيد الاستدعاء لبدء اللعبة 👁️</button>
    </div>
  </div>

  <canvas id="fog-canvas"></canvas>
  <div class="screen-overlay"></div>

  <!-- HUD Control Bar -->
  <div class="hud-header">
    <div>
      <span style="color:var(--text-muted)">الضحية:</span>
      <b id="hud-name" style="color:var(--accent-gold)">طالب جديد</b>
    </div>

    <div class="radar-box">
      ⚠️ اقتراب الجموع: <span id="distance-display">100m</span>
    </div>

    <div>
      النقاط: <b id="hud-score" style="color:var(--accent-gold)">0</b> XP
    </div>
  </div>

  <!-- 3D POV World Scene -->
  <div class="pov-container" id="pov-scene">
    <div class="courtyard-bg" id="courtyard"></div>

    <!-- Wanted Board with Student Info -->
    <div class="billboard">
      <h3>⚠️ الضحية القادمة في ساحة ENSTP ⚠️</h3>
      <h2 id="billboard-name">طالب جديد</h2>
      <p style="color:var(--text-muted)">التخصص: الهندسة المدنية والأشغال العمومية</p>
    </div>

    <!-- Advancing Entity Figure -->
    <div class="advancing-entity" id="entity-figure"></div>
  </div>

  <!-- Bottom Interactive Guide Zones -->
  <div class="hud-zones" id="hud-zones-list"></div>

  <!-- Challenge Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <h2 style="color:var(--red-glow); margin-bottom:15px;" id="modal-title">عنوان القطاع</h2>
      <div id="modal-info"></div>
      <div style="margin-top:20px; background:rgba(122,18,28,0.2); padding:15px; border:1px dashed var(--red-glow); border-radius:6px;" id="modal-quiz"></div>
    </div>
  </div>

  <script>
    // Audio Context Setup
    let audioCtx = null;
    let isAudioPlaying = false;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playScareSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // State Variables
    let playerName = "طالب جديد";
    let playerScore = 0;
    let distance = 100;
    let entityScale = 0.3;
    let gameLoopInterval = null;
    let solvedQuizzes = [];

    // ENSTP Guide Data
    const zonesData = [
      { id: "map", title: "🗺️ الخريطة", info: "تقع المدرسة بمدينة القبة، العاصمة.", q: "أين تقع المدرسة الوطنية العليا لأشغال العمومية؟", options: ["القبة", "باب الزوار", "الحراش"], correct: 0 },
      { id: "admin", title: "🏛️ الإدارة", info: "مصلحة الدراسات تتكفل بالتسجيلات وكشوف النقاط.", q: "من يسلم كشوف النقاط؟", options: ["المكتبة", "مصلحة شؤون الطلبة", "المطعم"], correct: 1 },
      { id: "profs", title: "👥 الأساتذة", info: "تواصل مع الأساتذة عبر إيميلاتهم والساعات المكتبية.", q: "كيف تحجز موعداً مع الأستاذ؟", options: ["عبر البريد الرسمى والساعات المكتبية", "في الشارع", "بدون موعد"], correct: 0 },
      { id: "schedule", title: "⏳ الجدول", info: "3 غيابات غير مبررة في TD/TP تؤدي للإقصاء.", q: "كم غياباً يسبب الإقصاء؟", options: ["5 غيابات", "3 غيابات", "10 غيابات"], correct: 1 },
      { id: "exams", title: "📝 الامتحانات", info: "يتم تقييم المادة بناءً على الامتحان والـ TD.", q: "كيف يُقيّم قسم الـ TD؟", options: ["اختبارات قصيرة وواجبات", "حضور فقط", "بدون علامة"], correct: 0 },
      { id: "transport", title: "🚌 النقل", info: "حافلات CUSTU والمترو يسهلان التنقل.", q: "ما هي وسيلة النقل الأساسية للطلبة؟", options: ["حافلات CUSTU والمترو", "الطيران", "سيارة خاصة"], correct: 0 },
      { id: "residence", title: "🏢 الإقامة", info: "الدخول للمطعم يتطلب بطاقة الطالب.", q: "ما الشرط لدخول المطعم الجامعي؟", options: ["إظهار بطاقة الطالب", "جواز السفر", "بدون وثيقة"], correct: 0 },
      { id: "sports", title: "⚽ الرياضة", info: "تُنظم دوريات رياضية بين التخصصات.", q: "هل توفر المدرسة دوريات رياضية؟", options: ["نعم بين التخصصات والدفعات", "لا توجد", "للأساتذة فقط"], correct: 0 }
    ];

    function startExperience() {
      const nameInput = document.getElementById('input-student-name').value.trim();
      if (nameInput) playerName = nameInput;

      document.getElementById('hud-name').innerText = playerName;
      document.getElementById('billboard-name').innerText = playerName;
      document.getElementById('intro-screen').style.display = 'none';

      playScareSound();
      renderHUDZones();

      // Start Entity Advancing Game Loop
      gameLoopInterval = setInterval(advanceEntity, 1000);
    }

    function advanceEntity() {
      if (distance > 0) {
        distance -= 2;
        entityScale += 0.015;
        document.getElementById('distance-display').innerText = distance + "m";
        
        const entity = document.getElementById('entity-figure');
        entity.style.transform = `scale(${entityScale})`;
        
        // Perspective Shake Effect when close
        if (distance < 30) {
          document.getElementById('courtyard').style.transform = `scale(1.05) translate(${Math.random()*6-3}px, ${Math.random()*6-3}px)`;
        }
      } else {
        clearInterval(gameLoopInterval);
        playScareSound();
        alert(`🚨 أحيطت بك أشباح الساحة يا ${playerName}! لم تجب بسرعة كافية على الدليل. أعد المحاولة!`);
        resetGame();
      }
    }

    function resetGame() {
      distance = 100;
      entityScale = 0.3;
      document.getElementById('distance-display').innerText = "100m";
      document.getElementById('entity-figure').style.transform = "scale(0.3)";
      gameLoopInterval = setInterval(advanceEntity, 1000);
    }

    function renderHUDZones() {
      const list = document.getElementById('hud-zones-list');
      list.innerHTML = '';
      zonesData.forEach(zone => {
        const isSolved = solvedQuizzes.includes(zone.id);
        const btn = document.createElement('button');
        btn.className = 'hud-btn';
        btn.innerHTML = `${zone.title} ${isSolved ? '✔' : ''}`;
        btn.onclick = () => openModal(zone);
        list.appendChild(btn);
      });
    }

    function openModal(zone) {
      document.getElementById('modal-title').innerText = zone.title;
      document.getElementById('modal-info').innerHTML = `<p>${zone.info}</p>`;
      
      const quizContainer = document.getElementById('modal-quiz');
      if (solvedQuizzes.includes(zone.id)) {
        quizContainer.innerHTML = `<p style="color:var(--accent-gold)">✨ تم فك شفرة هذا القسم بنجاح!</p>`;
      } else {
        quizContainer.innerHTML = `
          <h4>⚠️ لغز النجاة (أجب لتبطئة الجموع):</h4>
          <p style="margin-bottom:10px;">${zone.q}</p>
          ${zone.options.map((opt, idx) => `
            <button class="quiz-option" onclick="checkAnswer('${zone.id}', ${idx}, ${zone.correct})">${opt}</button>
          `).join('')}
        `;
      }
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function checkAnswer(zoneId, selected, correct) {
      if (selected === correct) {
        alert("🎉 إجابة صحيحة! تم دحر الجموع للخلف بكسب +20 متراً!");
        solvedQuizzes.push(zoneId);
        playerScore += 10;
        distance = Math.min(100, distance + 20);
        entityScale = Math.max(0.3, entityScale - 0.15);
        document.getElementById('hud-score').innerText = playerScore;
        renderHUDZones();
        closeModal();
      } else {
        playScareSound();
        distance = Math.max(0, distance - 15);
        alert("❌ إجابة خاطئة! الجموع تتقدم فوراً بمقدار -15 متراً!");
        closeModal();
      }
    }

    // Canvas Fog Animation Effect
    const canvas = document.getElementById('fog-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 35; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 80 + 40,
        alpha: Math.random() * 0.2 + 0.05,
        speedX: Math.random() * 0.6 - 0.3,
        speedY: Math.random() * 0.4 - 0.2
      });
    }

    function animateFog() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.speedX; p.y += p.speedY;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
        grad.addColorStop(0, `rgba(255, 42, 58, ${p.alpha})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(animateFog);
    }
    animateFog();
  </script>
</body>
</html>
