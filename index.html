<head>

  <style>
    :root {
      --bg-dark: #050505;
      --panel-bg: rgba(15, 18, 22, 0.95);
      --red-glow: #e63946;
      --red-dim: #7a121c;
      --accent-gold: #d4af37;
      --text-light: #e0e6ed;
      --text-muted: #94a3b8;
      --border-color: rgba(230, 57, 70, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Fog Canvas Background */
    #fog-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Overlay Scanlines & Vignette */
    .screen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      background: 
        radial-gradient(circle, transparent 50%, rgba(0, 0, 0, 0.9) 100%),
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 100%, 100% 4px;
    }

    /* Main Container */
    .app-container {
      position: relative;
      z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header & Title */
    header {
      text-align: center;
      padding: 30px 10px;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 30px;
      background: radial-gradient(ellipse at center, rgba(122, 18, 28, 0.3) 0%, transparent 70%);
    }

    header h1 {
      font-family: 'Amiri', serif;
      font-size: 3.2rem;
      color: var(--red-glow);
      text-shadow: 0 0 15px rgba(230, 57, 70, 0.7), 2px 2px 0px #000;
      letter-spacing: 1px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 5px;
    }

    /* Player Profile Bar */
    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .player-info input {
      background: #111;
      border: 1px solid var(--red-dim);
      color: var(--accent-gold);
      padding: 8px 15px;
      border-radius: 4px;
      font-family: 'Cairo', sans-serif;
      font-weight: bold;
    }

    .score-badge {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* Control Buttons */
    .btn {
      background: var(--red-dim);
      color: white;
      border: 1px solid var(--red-glow);
      padding: 10px 20px;
      font-family: 'Cairo', sans-serif;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: var(--red-glow);
      box-shadow: 0 0 15px rgba(230, 57, 70, 0.8);
      transform: translateY(-2px);
    }

    /* Grid Layout */
    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }

    @media (max-width: 992px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Map Zones Layout */
    .zones-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .zone-card {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .zone-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, rgba(230, 57, 70, 0.2), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .zone-card:hover {
      border-color: var(--red-glow);
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 10px 25px rgba(230, 57, 70, 0.3);
    }

    .zone-card:hover::before {
      opacity: 1;
    }

    .zone-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      display: block;
    }

    .zone-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    .zone-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Sidebar / Leaderboard */

      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
      height: fit-content;

      color: var(--accent-gold);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;

    .leaderboard-list {

    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;

    .leaderboard-item:first-child {
      color: var(--accent-gold);
      font-weight: bold;
      background: rgba(212, 175, 55, 0.05);
      border-radius: 4px;
    }

    .rank {
      width: 25px;
      font-weight: bold;
    }

    /* Modal Display */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;

    .modal-overlay.active {

    }

    .modal-content {
      background: #0f1216;

      max-height: 88vh;

      border-radius: 12px;
      padding: 30px;

    .close-modal {

      left: 20px;
      background: none;
      border: none;
      color: var(--text-muted);

      cursor: pointer;
      transition: background 0.2s;

      background: var(--red-dim);

  </style>
</head>

  <script>
    // Audio Context Setup (Free Procedural Web Audio API Sound Effects)
    let audioCtx = null;
    let isAudioPlaying = false;
    let droneOsc = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleAudio() {
      initAudio();
      if (isAudioPlaying) {
        if (droneOsc) droneOsc.stop();
        isAudioPlaying = false;
      } else {
        droneOsc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        droneOsc.type = 'sawtooth';
        droneOsc.frequency.setValueAtTime(55, audioCtx.currentTime); // Low creepy hum
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(200, audioCtx.currentTime);

        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

        droneOsc.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        droneOsc.start();
        isAudioPlaying = true;
      }
    }

    function playScareSound() {
      if (!audioCtx || !isAudioPlaying) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

        icon: "📐",
        img: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=800&q=80",
        desc: "المتجر المنسي والأدوات",
        info: [
          { subtitle: "أدوات الرسم الهندسي", content: "شراء مساطر T، ورق المليمتر، والأقلام التقنية المخصصة للرسم الميكانيكي والهندسي." },
          { subtitle: "مراكز الطباعة", content: "مكتبات سريعة قريبة لطباعة الدروس (Polycopies) والبحوث." }
        ],
        quiz: {
          q: "ما هي الأداة الأساسية للرسم الهندسي في السنة الأولى؟",
          options: ["مسطرة T والأقلام التقنية", "الألوان الزيتية", "الفرشاة"],
          correct: 0
        }
      }
    ];

    // State Variables
    let playerScore = parseInt(localStorage.getItem('enstp_score') || '0');
    let playerName = localStorage.getItem('enstp_player') || 'طالب جديد';
    let solvedQuizzes = JSON.parse(localStorage.getItem('enstp_solved') || '[]');

    // Leaderboard Data
    let leaderboardData = [
      { name: "أمِين (مهندس الطرق)", score: 100 },
      { name: "سَارة (تخصص جسور)", score: 80 },
      { name: "يَاسين (منشآت فنية)", score: 60 }
    ];

    // Render Map Zones
    function renderZones() {
      const container = document.getElementById('zones-container');
      container.innerHTML = '';
      zonesData.forEach(zone => {
        const isSolved = solvedQuizzes.includes(zone.id);
        const card = document.createElement('div');
        card.className = 'zone-card';
        card.onclick = () => openModal(zone);
        card.innerHTML = `
          <span class="zone-icon">${zone.icon}</span>
          <div class="zone-title">${zone.title}</div>
          <div class="zone-desc">${zone.desc}</div>
          ${isSolved ? '<span style="color:var(--accent-gold); font-size:0.8rem; margin-top:5px; display:block;">✔ تم النجاح</span>' : ''}
        `;
        container.appendChild(card);
      });
    }

    // Render Leaderboard
    function renderLeaderboard() {
      const list = document.getElementById('leaderboard');
      list.innerHTML = '';

      let fullList = [...leaderboardData, { name: playerName, score: playerScore }];
      fullList.sort((a, b) => b.score - a.score);

      fullList.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
          <span><span class="rank">${index + 1}.</span> ${item.name}</span>
          <span style="color:var(--accent-gold)">${item.score} XP</span>
        `;
        list.appendChild(li);
      });
    }

    // Player Stats Updates
    function updatePlayerName(val) {
      playerName = val || 'طالب جديد';
      localStorage.setItem('enstp_player', playerName);
      renderLeaderboard();
    }

    function addScore(points) {
      playerScore += points;
      document.getElementById('player-score').innerText = playerScore;
      localStorage.setItem('enstp_score', playerScore);
      renderLeaderboard();
    }

    // Modal Control
    function openModal(zone) {
      playScareSound();
      document.getElementById('modal-title').innerText = zone.title;
      document.getElementById('modal-img').src = zone.img;
      
      const infoContainer = document.getElementById('modal-info');
      infoContainer.innerHTML = '';
      zone.info.forEach(item => {
        infoContainer.innerHTML += `
          <div class="info-section">
            <h4>${item.subtitle}</h4>
            <p>${item.content}</p>
          </div>
        `;
      });

      const quizContainer = document.getElementById('modal-quiz');
      if (solvedQuizzes.includes(zone.id)) {
        quizContainer.innerHTML = `<p style="color:var(--accent-gold); text-align:center;">✨ لقد نجحت في فك شفرة هذا القسم بنجاح!</p>`;
      } else {
        quizContainer.innerHTML = `
          <h4>⚠️ لغز البقاء (اختبار المعلومات):</h4>
          <p style="margin-bottom:10px;">${zone.quiz.q}</p>
          ${zone.quiz.options.map((opt, idx) => `
            <button class="quiz-option" onclick="checkAnswer('${zone.id}', ${idx}, ${zone.quiz.correct})">${opt}</button>
          `).join('')}
        `;
      }

      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function checkAnswer(zoneId, selected, correct) {
      if (selected === correct) {
        alert("🎉 إجابة صحيحة! تم كسب +10 نقاط معرفية.");
        solvedQuizzes.push(zoneId);
        localStorage.setItem('enstp_solved', JSON.stringify(solvedQuizzes));
        addScore(10);
        renderZones();
        closeModal();
      } else {
        playScareSound();
        alert("❌ إجابة خاطئة! احذر من ظلال المدرسة...");
      }
    }

    // Canvas Fog Animation Effect
    const canvas = document.getElementById('fog-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 80 + 40,
        alpha: Math.random() * 0.2 + 0.05,
        speedX: Math.random() * 0.6 - 0.3,
        speedY: Math.random() * 0.4 - 0.2
      });
    }

    function animateFog() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
        grad.addColorStop(0, `rgba(230, 57, 70, ${p.alpha})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(animateFog);
    }
    animateFog();

    // Initial Launch Setup
    document.getElementById('player-name').value = playerName;
    document.getElementById('player-score').innerText = playerScore;
    renderZones();
    renderLeaderboard();
  </script>
</body>
</html>
